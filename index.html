<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eeece5" />
    <script>
      (() => {
        let theme = matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";
        try {
          const saved = localStorage.getItem("syntaxticsugr.theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#151619" : "#eeece5";
      })();
    </script>
    <meta
      name="description"
      content="Aditya Raj — founding engineer at HeyTheo and Vediq. Apps, backend systems, infrastructure, and applied AI. ViPER audio presets and anime."
    />

      property="og:description"
      content="Aditya Raj’s work: apps, backend services, infrastructure, and applied AI. Plus ViPER audio presets and an anime watchlist."
